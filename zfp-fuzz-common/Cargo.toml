[package]
name = "zfp-fuzz-common"
version = "0.0.0"
edition = "2024"
publish = false
description = "Bounded input model and target bodies shared by the zfp-rs fuzz targets"

[features]
default = []
rayon = ["zfp-rs/rayon"]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libm = "0.2"
# `ffi` is required: the `block_codec` target drives
# `codec::block::*_strided_with_params`, which is public only with that feature.
# `zfp-benchmarks` already unifies `ffi` into `cargo test --workspace`, so this
# does not change what the workspace build resolves.
zfp-rs = { workspace = true, features = ["ffi"] }
