language = "C"
include_guard = "ZFP_RS_FFI_H"
autogen_warning = "/* Generated by cbindgen. Do not edit by hand. */"
cpp_compat = true
usize_is_size_t = true
line_length = 100
tab_width = 2
documentation = false

after_includes = """
#define ZFP_VERSION_MAJOR 1
#define ZFP_VERSION_MINOR 0
#define ZFP_VERSION_PATCH 1
#define ZFP_VERSION_TWEAK 0
#define ZFP_VERSION_DEVELOP 1
#define ZFP_CODEC 5

#define ZFP_MAKE_VERSION(major, minor, patch, tweak) \\
  (((major) << 12) + ((minor) << 8) + ((patch) << 4) + ((tweak) << 0))
#define ZFP_VERSION \\
  ZFP_MAKE_VERSION(ZFP_VERSION_MAJOR, ZFP_VERSION_MINOR, ZFP_VERSION_PATCH, ZFP_VERSION_TWEAK)
#define ZFP_VERSION_STRING \"1.0.1\"

#define ZFP_MIN_BITS 1
#define ZFP_MAX_BITS 16658
#define ZFP_MAX_PREC 64
#define ZFP_MIN_EXP -1074

#define ZFP_HEADER_NONE 0x0u
#define ZFP_HEADER_MAGIC 0x1u
#define ZFP_HEADER_META 0x2u
#define ZFP_HEADER_MODE 0x4u
#define ZFP_HEADER_FULL 0x7u

#define ZFP_DATA_UNUSED 0x01u
#define ZFP_DATA_PADDING 0x02u
#define ZFP_DATA_META 0x04u
#define ZFP_DATA_MISC 0x08u
#define ZFP_DATA_PAYLOAD 0x10u
#define ZFP_DATA_INDEX 0x20u
#define ZFP_DATA_CACHE 0x40u
#define ZFP_DATA_HEADER 0x80u
#define ZFP_DATA_ALL 0xffu

#define ZFP_META_NULL UINT64_MAX
#define ZFP_MAGIC_BITS 32
#define ZFP_META_BITS 52
#define ZFP_MODE_SHORT_BITS 12
#define ZFP_MODE_LONG_BITS 64
#define ZFP_HEADER_MAX_BITS 148
#define ZFP_MODE_SHORT_MAX ((1u << ZFP_MODE_SHORT_BITS) - 2)

#define ZFP_ROUND_FIRST (-1)
#define ZFP_ROUND_NEVER 0
#define ZFP_ROUND_LAST 1

enum {
  zfp_false = 0,
  zfp_true = !zfp_false
};

typedef struct bitstream bitstream;
typedef int8_t int8;
typedef uint8_t uint8;
typedef int16_t int16;
typedef uint16_t uint16;
typedef int32_t int32;
typedef int64_t int64;

"""

[export]
item_types = ["typedefs", "enums", "structs", "unions", "opaque", "functions", "globals"]
exclude = [
  "ZFP_CODEC_VERSION",
  "ZFP_DATA_ALL",
  "ZFP_DATA_CACHE",
  "ZFP_DATA_HEADER",
  "ZFP_DATA_INDEX",
  "ZFP_DATA_META",
  "ZFP_DATA_MISC",
  "ZFP_DATA_PADDING",
  "ZFP_DATA_PAYLOAD",
  "ZFP_DATA_UNUSED",
  "ZFP_HEADER_FULL",
  "ZFP_HEADER_MAGIC",
  "ZFP_HEADER_MAX_BITS",
  "ZFP_HEADER_META",
  "ZFP_HEADER_MODE",
  "ZFP_HEADER_NONE",
  "ZFP_LIBRARY_MAJOR",
  "ZFP_LIBRARY_MINOR",
  "ZFP_LIBRARY_PATCH",
  "ZFP_LIBRARY_TWEAK",
  "ZFP_MAGIC_BITS",
  "ZFP_MAX_BITS",
  "ZFP_MAX_PREC",
  "ZFP_META_BITS",
  "ZFP_META_NULL",
  "ZFP_MIN_BITS",
  "ZFP_MIN_EXP",
  "ZFP_MODE_LONG_BITS",
  "ZFP_MODE_SHORT_BITS",
  "ZFP_MODE_SHORT_MAX",
  "ZFP_ROUND_FIRST",
  "ZFP_ROUND_LAST",
  "ZFP_ROUND_NEVER",
  "ZFP_VERSION_STRING",
  "ZFP_VERSION_STRING_BYTES",
  "bitstream",
  "zfp_exec_policy_zfp_exec_cuda",
  "zfp_exec_policy_zfp_exec_omp",
  "zfp_exec_policy_zfp_exec_serial",
  "zfp_false",
  "zfp_mode_zfp_mode_expert",
  "zfp_mode_zfp_mode_fixed_accuracy",
  "zfp_mode_zfp_mode_fixed_precision",
  "zfp_mode_zfp_mode_fixed_rate",
  "zfp_mode_zfp_mode_null",
  "zfp_mode_zfp_mode_reversible",
  "zfp_true",
  "zfp_type_zfp_type_double",
  "zfp_type_zfp_type_float",
  "zfp_type_zfp_type_int32",
  "zfp_type_zfp_type_int64",
  "zfp_type_zfp_type_none",
]

[parse]
parse_deps = false
