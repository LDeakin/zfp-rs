[package]
name = "zfp-rs-ffi"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.2"
edition = "2024"
description = "C ABI bindings layer around zfp-rs: mirrors the zfp-sys API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LDeakin/zfp-rs"
readme = "README.md"
keywords = ["compression", "scientific", "array", "numeric", "zfp"]
categories = ["algorithms", "science", "mathematics"]

[lib]
crate-type = ["rlib", "staticlib"]

# ABI functions are exported with their upstream-compatible `zfp_*` and
# `stream_*` C symbol names.
[features]
default = []
rayon = ["dep:rayon", "zfp-rs/rayon"]
# Mirror zfp's build-time ZFP_ROUNDING_MODE / ZFP_WITH_TIGHT_ERROR: the C
# `zfp_stream` has no field for them, so they are fixed at build time here too.
# `round-first` and `round-last` are mutually exclusive.
round-first = []
round-last = []
tight-error = []
# Named to match the zfp-sys feature that sets the same two CMake defines.
round-tight-error = ["round-first", "tight-error"]

[dependencies]
zfp-rs = { workspace = true, features = ["ffi"] }
rayon = { version = "1", optional = true }

[dev-dependencies]
bytemuck = "1"
libloading = "0.8"
proptest = "1"
zfp-sys = "0.4"
