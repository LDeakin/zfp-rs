[workspace]
members = [
    ".",
    "zfp-test-utils",
    "zfp-rs-ffi",
    "zfp-benchmarks",
    "zfp-fuzz-common",
]
# Both have their own [workspace] table and must never be pulled into
# `cargo build --workspace` or `cargo clippy --workspace --all-targets`:
# `fuzz/` needs a nightly toolchain and libFuzzer, and `zfp-round-tests/` needs
# a `zfp-sys` built with rounding enabled, which cargo would unify onto the
# stock-zfp suites.
exclude = ["fuzz", "zfp-round-tests"]

[package]
name = "zfp-rs"
authors = ["Lachlan Deakin <ljdgit@gmail.com>"]
version = "0.1.1"
edition = "2024"
description = "A pure-Rust implementation of the ZFP compression algorithm"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LDeakin/zfp-rs"
readme = "README.md"
keywords = ["compression", "scientific", "array", "numeric", "zfp"]
categories = ["algorithms", "science", "mathematics"]

[features]
default = []
# Expose low-level APIs needed by the C-ABI FFI bindings layer:
# parameter query functions, block encode/decode with explicit params,
# and type promotion functions.
ffi = []
# Expose the monomorphised codec internals (`codec::encode`, `codec::decode`).
# Test-only: the C-port and proptest suites reach them; the C-ABI layer does not.
internals = []
# Optional Rayon-based parallel execution support.
rayon = ["dep:rayon"]

[dependencies]
bitflags = "2"
bytemuck = "1"
libm = "0.2"
rayon = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
zfp-sys = "0.4"
zfp-test-utils = { path = "zfp-test-utils" }

# The C-port and proptest suites split into two targets each: one covering the
# public API, and one reaching the low-level codec behind `internals`.
[[test]]
name = "c"

[[test]]
name = "c_internals"
required-features = ["ffi", "internals"]

[[test]]
name = "proptest"

[[test]]
name = "proptest_internals"
required-features = ["internals"]

[workspace.dependencies.zfp-rs]
version = "0.1.1"
path = "."
