[package]
name = "zfp-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false

[[bench]]
name = "api_compare"
harness = false

[dependencies]
bytemuck = "1"
criterion = { version = "0.8", features = ["html_reports"] }
zfp-rs = { path = "..", features = ["ffi", "rayon"] }
zfp-rs-ffi = { path = "../zfp-rs-ffi", features = ["rayon"] }
zfp-sys = "0.4"
