name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path zfp-round-tests/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            zfp-round-tests
      - run: cargo clippy --features ffi,internals --workspace --all-targets -- -D warnings
      # `--workspace` always resolves `ffi` onto zfp-rs, because zfp-benchmarks
      # and zfp-fuzz-common both depend on it with that feature. Lint zfp-rs on
      # its own to reach the `not(feature = "ffi")` arms.
      - run: cargo clippy -p zfp-rs --all-targets -- -D warnings
      - run: cargo clippy -p zfp-rs --features rayon --all-targets -- -D warnings
      - run: cargo clippy -p zfp-rs-ffi --features round-last,tight-error --all-targets -- -D warnings
      # Outside the workspace, so `--workspace` above misses it.
      - run: cargo clippy --manifest-path zfp-round-tests/Cargo.toml --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features ffi,internals --workspace
      # Not `--workspace`: feature unification through zfp-benchmarks and
      # zfp-fuzz-common would enable `ffi` anyway, leaving the default-feature
      # build untested.
      - run: cargo test -p zfp-rs

  rounding:
    name: Test (rounding modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            zfp-round-tests
      # Its own workspace: zfp-sys feature unification would otherwise build a
      # rounding C zfp for the stock-zfp targets too.
      - run: cargo test --manifest-path zfp-round-tests/Cargo.toml
      # zfp-rs-ffi builds its own reference zfp with matching CMake defines, so
      # every mode is cross-validated here.
      - run: cargo test -p zfp-rs-ffi --features round-first
      - run: cargo test -p zfp-rs-ffi --features round-last
      - run: cargo test -p zfp-rs-ffi --features round-tight-error
      - run: cargo test -p zfp-rs-ffi --features round-last,tight-error

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # ubuntu-24.04 runner images use 32-bit ASLR entropy, which makes
      # AddressSanitizer/LeakSanitizer abort at startup.
      - name: Relax ASLR entropy for AddressSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # Gating: the targets must always compile.
      - run: cargo fuzz build
      # Gating: every committed crash input must stay fixed. This also runs on
      # stable in the `test` job via `cargo test --features ffi,internals
      # --workspace`; running it here catches drift between a target and the
      # replay harness.
      - run: cargo test -p zfp-fuzz-common --test regressions
      # Non-gating for now: a randomised run can rediscover a pre-existing bug
      # on an unrelated PR. Promote to gating once the fuzzers have been clean
      # for a few weeks by deleting the `continue-on-error` line.
      - name: Smoke-run each fuzz target
        continue-on-error: true
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run "$target" \
              "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time=30 -max_len=4096 \
                 -rss_limit_mb=2048 -malloc_limit_mb=1024 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  miri:
    name: Miri (strided provenance)
    runs-on: ubuntu-latest
    steps:
      # No `submodules: recursive`: zfp-fuzz-common has no C dependencies, which
      # is why the Miri suite lives there rather than in zfp-rs, whose
      # dev-dependencies would pull in cmake, bindgen and a C toolchain.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      # `--test miri` is deliberate: a bare `-p zfp-fuzz-common` would also
      # replay the whole committed crash corpus, which is far too slow to
      # interpret. Rayon stays off — the parallel path calls the same
      # `decompress_block` as the serial one, so it is covered by construction.
      - name: Strided compress/decompress under Stacked Borrows
        run: cargo miri test -p zfp-fuzz-common --test miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
